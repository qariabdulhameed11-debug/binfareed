<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BinFareedStore — Fine Horology & Luxury Timepieces</title>
    <meta
      name="description"
      content="Discover curated Swiss, Japanese, and bespoke luxury watches at BinFareedStore. Authenticated timepieces, insured nationwide delivery across Pakistan, and guaranteed authenticity."
    />
    <meta property="og:title" content="BinFareedStore — Fine Horology & Luxury Timepieces" />
    <meta
      property="og:description"
      content="Discover curated Swiss, Japanese, and bespoke luxury watches at BinFareedStore. Authenticated timepieces with guaranteed authenticity."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Brand icons -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  <body class="bg-[#FAF8F5] text-[#0D0D0D] antialiased selection:bg-[#C5A059]/25 selection:text-[#0D0D0D]">
    <!-- Opening loader: a watch dial whose 60 minute marks light up 1% → 100% with the intro
         sound, then a curtain reveal. Pure HTML/CSS/JS so it paints before the app bundle. -->
    <div id="bfs-loader" role="status" aria-live="polite" aria-label="Loading BinFareed Store">
      <div class="bfs-panel bfs-top"></div>
      <div class="bfs-panel bfs-bot"></div>
      <div class="bfs-stage">
        <div class="bfs-dial">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="bfsGold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#F4DFA8" />
                <stop offset=".5" stop-color="#C5A059" />
                <stop offset="1" stop-color="#9E7B36" />
              </linearGradient>
              <radialGradient id="bfsFace" cx="50%" cy="45%" r="60%">
                <stop offset="0" stop-color="#1c1810" />
                <stop offset="1" stop-color="#0a0a0b" />
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#bfsFace)" stroke="url(#bfsGold)" stroke-width="1.2" />
            <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(197,160,89,.12)" stroke-width=".6" />
            <g id="bfs-ticks"></g>
            <g id="bfs-hour" style="transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="58" stroke="url(#bfsGold)" stroke-width="3" stroke-linecap="round" /></g>
            <g id="bfs-min" style="transform-origin:100px 100px"><line x1="100" y1="104" x2="100" y2="30" stroke="#F4DFA8" stroke-width="1.6" stroke-linecap="round" /></g>
            <circle cx="100" cy="100" r="3.2" fill="url(#bfsGold)" />
          </svg>
          <img src="/brand/logo-mark.png" alt="" width="54" height="54" style="border-radius:50%;object-fit:contain" />
        </div>
        <div class="bfs-word" style="font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px,4.5vw,26px);font-weight:700;letter-spacing:0.22em;color:#F4DFA8;text-transform:uppercase;text-align:center;text-shadow:0 2px 14px rgba(197,160,89,0.35)">BinFareed Store</div>
        <div class="bfs-count"><span id="bfs-pct">1</span><small>%</small></div>
        <div class="bfs-rule"><span id="bfs-bar"></span></div>
        <p class="bfs-cap" id="bfs-cap">Entering the Watch World</p>

      </div>
    </div>
    <audio id="bfs-bg-audio" src="/brand/new.mp3" preload="auto" playsinline></audio>
    <style>
      #bfs-loader{position:fixed;inset:0;z-index:9999;overflow:hidden;color:#F4DFA8;pointer-events:auto}
      #bfs-loader .bfs-panel{position:absolute;left:0;right:0;height:50.5%;background:radial-gradient(120% 140% at 50% 100%,#17140e 0%,#08090b 60%);transition:transform 1.1s cubic-bezier(.77,0,.18,1)}
      #bfs-loader .bfs-top{top:0}
      #bfs-loader .bfs-bot{bottom:0;background:radial-gradient(120% 140% at 50% 0%,#17140e 0%,#08090b 60%)}
      #bfs-loader .bfs-top::after,#bfs-loader .bfs-bot::before{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(197,160,89,.55),transparent);opacity:0;transition:opacity .4s}
      #bfs-loader .bfs-top::after{bottom:0}
      #bfs-loader .bfs-bot::before{top:0}
      .bfs-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease,transform .6s cubic-bezier(.16,1,.3,1)}
      .bfs-dial{position:relative;width:min(150px,38vw);aspect-ratio:1;filter:drop-shadow(0 20px 50px rgba(197,160,89,.18));animation:bfs-rise 1s cubic-bezier(.16,1,.3,1) both}
      .bfs-dial svg{position:absolute;inset:0;width:100%;height:100%}
      .bfs-dial img{position:absolute;left:50%;top:63%;width:23%;height:auto;transform:translate(-50%,-50%);opacity:.95}
      .bfs-tick{transition:stroke .25s,opacity .25s}
      .bfs-word{height:clamp(30px,5vw,38px);width:auto;margin-top:4px;filter:drop-shadow(0 4px 18px rgba(197,160,89,.25));animation:bfs-rise 1s .05s cubic-bezier(.16,1,.3,1) both}
      .bfs-count{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(26px,5vw,34px);line-height:1;font-weight:500;letter-spacing:.02em;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1,'tnum' 1;background:linear-gradient(100deg,#9E7B36,#F4DFA8 45%,#C5A059 70%,#9E7B36);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bfs-rise 1s .1s cubic-bezier(.16,1,.3,1) both}
      .bfs-count small{font-size:.45em;margin-left:3px;vertical-align:.9em}
      .bfs-rule{width:min(160px,50vw);height:1px;background:rgba(197,160,89,.18);overflow:hidden}
      .bfs-rule span{display:block;height:100%;width:1%;background:linear-gradient(90deg,transparent,#F4DFA8,#C5A059);box-shadow:0 0 10px rgba(223,189,120,.8)}
      .bfs-cap{margin:0;min-height:1.4em;font:500 10px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:rgba(244,223,168,.78);transition:opacity .35s ease,transform .35s ease}
      .bfs-cap.swap{opacity:0;transform:translateY(6px)}
      .bfs-sound-btn{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(197,160,89,.15);border:1px solid rgba(197,160,89,.45);border-radius:9999px;color:#F4DFA8;font:500 10px/1 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all .25s ease;pointer-events:auto;animation:bfs-rise 1s .15s cubic-bezier(.16,1,.3,1) both}
      .bfs-sound-btn:hover{background:rgba(197,160,89,.3);border-color:#F4DFA8;transform:scale(1.05)}
      .bfs-sound-btn.playing{background:rgba(197,160,89,.28);border-color:#C5A059;color:#FAF8F5}
      #bfs-loader.bfs-muted .bfs-sound-btn{animation:bfs-blink 1.8s ease-in-out infinite}
      .bfs-hint{position:absolute;bottom:30px;left:0;right:0;margin:0;text-align:center;font:500 11px/1 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.2em;color:rgba(244,223,168,.6);opacity:0;transition:opacity .4s;pointer-events:none}
      #bfs-loader.bfs-muted .bfs-hint{animation:bfs-blink 1.6s ease-in-out infinite}
      /* Reveal: content lifts away, curtain panels slide open */
      #bfs-loader.bfs-open .bfs-stage{opacity:0;transform:scale(1.06)}
      #bfs-loader.bfs-open .bfs-top::after,#bfs-loader.bfs-open .bfs-bot::before{opacity:1}
      #bfs-loader.bfs-open .bfs-top{transform:translateY(-101%);transition-delay:.15s}
      #bfs-loader.bfs-open .bfs-bot{transform:translateY(101%);transition-delay:.15s}
      #bfs-loader.bfs-open{pointer-events:none}
      @keyframes bfs-rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
      @keyframes bfs-blink{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.bfs-dial,.bfs-count{animation:none}#bfs-loader .bfs-panel{transition:opacity .4s}#bfs-loader.bfs-open .bfs-top,#bfs-loader.bfs-open .bfs-bot{transform:none;opacity:0}}
    </style>
    <script>
      (function () {
        var loader = document.getElementById('bfs-loader');
        if (!loader) return;
        // Customers only: the admin console and print pages open instantly, no animation or sound
        if (location.pathname.indexOf('/admin') === 0) { loader.remove(); return; }
        var $ = function (id) { return document.getElementById(id); };
        var pctEl = $('bfs-pct'), barEl = $('bfs-bar'), capEl = $('bfs-cap');
        var hourEl = $('bfs-hour'), minEl = $('bfs-min'), ticksEl = $('bfs-ticks');

        // 60 minute marks; every 5th is a longer hour index
        var NS = 'http://www.w3.org/2000/svg', ticks = [];
        for (var i = 0; i < 60; i++) {
          var hour = i % 5 === 0;
          var l = document.createElementNS(NS, 'line');
          l.setAttribute('x1', '100'); l.setAttribute('x2', '100');
          l.setAttribute('y1', hour ? '12' : '13');
          l.setAttribute('y2', hour ? '26' : '19');
          l.setAttribute('stroke', 'rgba(197,160,89,.18)');
          l.setAttribute('stroke-width', hour ? '2.4' : '1');
          l.setAttribute('stroke-linecap', 'round');
          l.setAttribute('transform', 'rotate(' + i * 6 + ' 100 100)');
          l.setAttribute('class', 'bfs-tick');
          ticksEl.appendChild(l);
          ticks.push({ el: l, hour: hour });
        }

        var audio = document.getElementById('bfs-bg-audio');
        if (!audio) {
          try {
            audio = new Audio('/brand/new.mp3');
            audio.preload = 'auto';
          } catch (e) { audio = null; }
        }
        if (audio) {
          audio.loop = false;
          audio.volume = 0.65;
          window.__bfsIntroAudio = audio;
        }

        var DURATION = 3800;
        var audioStarted = false;
        var finished = false;
        var tryPlayAudio = function () {
          if (!audio || audioStarted || finished) return;
          var p = audio.play();
          if (p && typeof p.then === 'function') {
            p.then(function () {
              audioStarted = true;
              removeListeners();
            }).catch(function () {});
          }
        };

        var interactionEvents = ['pointerdown', 'touchstart', 'mousemove', 'wheel', 'scroll', 'keydown', 'click'];
        var onUserPresence = function () {
          tryPlayAudio();
        };

        var removeListeners = function () {
          interactionEvents.forEach(function (ev) {
            window.removeEventListener(ev, onUserPresence, { passive: true });
          });
        };

        interactionEvents.forEach(function (ev) {
          window.addEventListener(ev, onUserPresence, { passive: true });
        });

        tryPlayAudio();
        if (audio) {
          audio.addEventListener('canplay', tryPlayAudio, { once: true });
          audio.addEventListener('loadeddata', tryPlayAudio, { once: true });
        }
        window.addEventListener('load', tryPlayAudio, { once: true });
        document.addEventListener('DOMContentLoaded', tryPlayAudio, { once: true });

        var start = performance.now(), finished = false;
        var ease = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
        var lit = 0, lastCap = capEl.textContent;
        var setCap = function (text) {
          if (text === lastCap) return;
          lastCap = text;
          capEl.classList.add('swap');
          setTimeout(function () { capEl.textContent = text; capEl.classList.remove('swap'); }, 220);
        };
        var frame = function (now) {
          var p = Math.min(1, (now - start) / DURATION);
          var e = ease(p);
          var pct = Math.max(1, Math.round(e * 100));
          pctEl.textContent = pct;
          barEl.style.width = pct + '%';
          // Light the dial's minute marks as progress advances
          var target = Math.round(e * 60);
          while (lit < target) {
            var t = ticks[lit++];
            t.el.setAttribute('stroke', t.hour ? 'url(#bfsGold)' : '#DFBD78');
          }
          // Hands sweep: minute hand two full turns, hour hand one sixth
          minEl.style.transform = 'rotate(' + e * 720 + 'deg)';
          hourEl.style.transform = 'rotate(' + (300 + e * 60) + 'deg)';
          setCap(pct < 50 ? 'Entering the Watch World' : pct < 100 ? 'Unveiling the Collection' : 'Welcome to BinFareed');
          if (p < 1) requestAnimationFrame(frame);
          else finish();
        };
        var finish = function () {
          if (finished) return;
          finished = true;
          removeListeners();

          // Stop audio immediately as the loader reveals the site
          if (audio) {
            try {
              var fadeSteps = 8;
              var fadeInterval = setInterval(function () {
                fadeSteps--;
                if (audio.volume > 0.08 && fadeSteps > 0) {
                  audio.volume = Math.max(0, audio.volume - 0.08);
                } else {
                  clearInterval(fadeInterval);
                  audio.pause();
                  audio.currentTime = 0;
                  if (audio.parentNode) {
                    audio.parentNode.removeChild(audio);
                  }
                }
              }, 40);
            } catch (err) {
              audio.pause();
            }
          }

          setTimeout(function () {
            loader.classList.add('bfs-open');
            setTimeout(function () { loader.remove(); }, 1400);
          }, 350);
        };
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
